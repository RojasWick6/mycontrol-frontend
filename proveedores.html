<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | MyControl</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">

<style>
.stats-top { display:grid; gap:12px; margin-bottom:20px; grid-template-columns:repeat(3,1fr); }

/* 1. En pantallas GRANDES de computadora, forzamos a ocultar el botón de móvil */
@media (min-width: 681px) {
    #btnAgregarWrap { display: none !important; }
}

@media (max-width: 680px) {
    .stats-top { grid-template-columns:1fr; }
    /* 2. En pantallas CHICAS de móvil, forzamos a ocultar el botón de la barra superior */
    #btnAgregar { display: none !important; }
    .topbar-right button[onclick] { display:none !important; }
}

@media (max-width: 480px) {
    .main-content { padding: 12px !important; }
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p class="loading-texto">Cargando...</p>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/img/logoF.png" class="logo" alt="MyControl logo">
            <h2>MyControl</h2>
        </div>
        <nav class="menu">
            <a class="menu-item" href="tienda-config.html"><span class="icon">🛍️</span><span class="text">Catálogo</span></a>
            <a class="menu-item" href="dashboard.html"><span class="icon">🏠</span><span class="text">Inicio</span></a>
            <a class="menu-item" href="inventario.html"><span class="icon">📦</span><span class="text">Inventario</span></a>
            <a class="menu-item" href="ventas.html"><span class="icon">💰</span><span class="text">Ventas</span></a>
            <a class="menu-item" href="compras.html"><span class="icon">🧾</span><span class="text">Compras</span></a>
            <a class="menu-item active" href="proveedores.html"><span class="icon">👥</span><span class="text">Proveedores</span></a>
            <a class="menu-item" href="reportes.html"><span class="icon">📊</span><span class="text">Reportes</span></a>
            <a class="menu-item" href="configuracion.html"><span class="icon">⚙</span><span class="text">Configuración</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1>Proveedores</h1>
            <div class="topbar-right">
                <div id="reloj" class="topbar-clock"></div>
                <button id="btnAgregar" onclick="abrirModalCrear()" style="display:none;padding:8px 16px;background:#FF8500;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px">+ Agregar proveedor</button>
            </div>
        </header> <div id="btnAgregarWrap" style="display:none;margin-bottom:16px">
        <button onclick="abrirModalCrear()" style="width:100%;padding:12px;background:#FF8500;color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer">+ Agregar proveedor</button>
    </div>
        

        <!-- STATS -->
        <section class="stats-top">
            <div style="background:white;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:46px;height:46px;border-radius:12px;background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:22px">👥</div>
                <div>
                    <p style="font-size:12px;color:#aaa;margin-bottom:2px">Total proveedores</p>
                    <p style="font-size:22px;font-weight:800;color:#FF8500" id="statTotal">0</p>
                </div>
            </div>
            <div style="background:white;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:46px;height:46px;border-radius:12px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:22px">💰</div>
                <div>
                    <p style="font-size:12px;color:#aaa;margin-bottom:2px">Total invertido</p>
                    <p style="font-size:22px;font-weight:800;color:#27ae60" id="statInvertido">$0.00</p>
                </div>
            </div>
            <div style="background:white;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:46px;height:46px;border-radius:12px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:22px">📊</div>
                <div>
                    <p style="font-size:12px;color:#aaa;margin-bottom:2px">Compras totales</p>
                    <p style="font-size:22px;font-weight:800;color:#e91e63" id="statCompras">0</p>
                </div>
            </div>
        </section>

        <!-- BUSCADOR -->
        <div style="margin-bottom:16px">
            <input type="text" id="buscadorProv" placeholder="🔍 Buscar proveedor..." oninput="filtrarProveedores()"
                style="width:100%;padding:12px 16px;border:1.5px solid #eee;border-radius:12px;font-size:14px;outline:none;box-sizing:border-box;background:white">
        </div>

        <!-- CARDS PROVEEDORES -->
        <div id="proveedoresGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px"></div>
    </main>
</div>

<!-- MODAL PROVEEDOR -->
<div class="modal" id="modalProveedor">
    <div class="modal-content" style="max-width:480px">
        <h2 id="modalProvTitle">Proveedor</h2>
        <input type="hidden" id="provId">

        <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="provNombre" placeholder="Nombre del proveedor">
        </div>
        <div class="form-group">
            <label>Descripción / Ubicación</label>
            <textarea id="provDescripcion" rows="2" placeholder="Ej: Mercado Merced, Local 21 — tintas y colorantes"
                style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:8px;font-size:14px;resize:vertical;outline:none;font-family:inherit;box-sizing:border-box"></textarea>
        </div>
        <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="provDireccion" placeholder="Dirección completa (opcional)">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="provTelefono" placeholder="555 123 4567">
            </div>
            <div class="form-group">
                <label>Teléfono 2</label>
                <input type="tel" id="provTelefono2" placeholder="Opcional">
            </div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="provEmail" placeholder="correo@proveedor.com">
        </div>
        <div class="modal-btns">
            <button onclick="cerrarModal()" style="background:#eee;color:#555">Cancelar</button>
            <button onclick="guardarProveedor()" style="background:#FF8500;color:white">Guardar</button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/session.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/proveedores.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
