<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | MyControl</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p class="loading-texto">Cargando...</p>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/img/logo.png" class="logo" alt="MyControl logo">
            <h2>MyControl</h2>
        </div>
        <nav class="menu">
            <a class="menu-item" href="dashboard.html"><span class="icon">🏠</span><span class="text">Inicio</span></a>
            <a class="menu-item" href="inventario.html"><span class="icon">📦</span><span class="text">Inventario</span></a>
            <a class="menu-item" href="ventas.html"><span class="icon">💰</span><span class="text">Ventas</span></a>
            <a class="menu-item" href="compras.html"><span class="icon">🧾</span><span class="text">Compras</span></a>
            <a class="menu-item" href="proveedores.html"><span class="icon">👥</span><span class="text">Proveedores</span></a>
            <a class="menu-item" href="reportes.html"><span class="icon">📊</span><span class="text">Reportes</span></a>
            <a class="menu-item" href="tienda-config.html"><span class="icon">🛍️</span><span class="text">Catálogo</span></a>
            <a class="menu-item" href="clientes.html"><span class="icon">🧑‍🤝‍🧑</span><span class="text">Clientes</span></a>
            <a class="menu-item active" href="pedidos.html"><span class="icon">📬</span><span class="text">Pedidos</span></a>
            <a class="menu-item" href="configuracion.html"><span class="icon">⚙</span><span class="text">Configuración</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1>📬 Pedidos</h1>
            <div class="topbar-right">
                <div id="reloj" class="topbar-clock"></div>
                <span class="topbar-user">👤 <span id="usuarioNombre"></span></span>
                <button class="btn-salir" id="btnSalir">Salir</button>
            </div>
        </header>

        <!-- STATS -->
        <section style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
            <div style="background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:42px;height:42px;border-radius:12px;background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:20px">📬</div>
                <div>
                    <p style="font-size:11px;color:#aaa;margin-bottom:2px">Pendientes</p>
                    <p style="font-size:20px;font-weight:800;color:#FF8500" id="statPendientes">0</p>
                </div>
            </div>
            <div style="background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:42px;height:42px;border-radius:12px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:20px">✅</div>
                <div>
                    <p style="font-size:11px;color:#aaa;margin-bottom:2px">Confirmados</p>
                    <p style="font-size:20px;font-weight:800;color:#27ae60" id="statConfirmados">0</p>
                </div>
            </div>
            <div style="background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:42px;height:42px;border-radius:12px;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:20px">🏁</div>
                <div>
                    <p style="font-size:11px;color:#aaa;margin-bottom:2px">Completados</p>
                    <p style="font-size:20px;font-weight:800;color:#1976d2" id="statCompletados">0</p>
                </div>
            </div>
            <div style="background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.07)">
                <div style="width:42px;height:42px;border-radius:12px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:20px">💰</div>
                <div>
                    <p style="font-size:11px;color:#aaa;margin-bottom:2px">Total del mes</p>
                    <p style="font-size:16px;font-weight:800;color:#e91e63" id="statTotal">$0.00</p>
                </div>
            </div>
        </section>

        <!-- FILTROS -->
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
            <button class="filtro-estado active" onclick="filtrarEstado('todos')" data-estado="todos"
                style="padding:8px 18px;border-radius:20px;border:2px solid #FF8500;background:#FF8500;color:white;font-weight:700;font-size:13px;cursor:pointer">
                Todos
            </button>
            <button class="filtro-estado" onclick="filtrarEstado('pendiente')" data-estado="pendiente"
                style="padding:8px 18px;border-radius:20px;border:2px solid #eee;background:white;color:#555;font-weight:700;font-size:13px;cursor:pointer">
                ⏳ Pendientes
            </button>
            <button class="filtro-estado" onclick="filtrarEstado('confirmado')" data-estado="confirmado"
                style="padding:8px 18px;border-radius:20px;border:2px solid #eee;background:white;color:#555;font-weight:700;font-size:13px;cursor:pointer">
                ✅ Confirmados
            </button>
            <button class="filtro-estado" onclick="filtrarEstado('completado')" data-estado="completado"
                style="padding:8px 18px;border-radius:20px;border:2px solid #eee;background:white;color:#555;font-weight:700;font-size:13px;cursor:pointer">
                🏁 Completados
            </button>
            <button class="filtro-estado" onclick="filtrarEstado('cancelado')" data-estado="cancelado"
                style="padding:8px 18px;border-radius:20px;border:2px solid #eee;background:white;color:#555;font-weight:700;font-size:13px;cursor:pointer">
                ❌ Cancelados
            </button>
        </div>

        <!-- LISTA PEDIDOS -->
        <div id="pedidosLista"></div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/session.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
