<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* ── HEADER ───────────────────────────────────────── */
        .cat-header {
            background: var(--color, #FF8500);
            color: white;
            padding: 20px 16px 60px;
            text-align: center;
            position: relative;
        }
        .cat-header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .cat-header p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .cat-header-redes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .cat-header-redes a {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .cat-header-redes a:hover { background: rgba(255,255,255,0.35); }

        /* ── BUSCADOR FLOTANTE ────────────────────────────── */
        .cat-search-wrap {
            padding: 0 16px;
            margin-top: -28px;
            margin-bottom: 20px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .cat-search {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            outline: none;
        }

        /* ── CONTENIDO PRINCIPAL ──────────────────────────── */
        .cat-main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .cat-info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .cat-info-bar span {
            font-size: 13px;
            color: #888;
        }
        .cat-info-bar strong {
            color: #333;
        }

        /* ── GRID DE PRODUCTOS ────────────────────────────── */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .cat-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .cat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .cat-card.agotado { opacity: 0.65; }

        .cat-card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #f0f0f0;
        }
        .cat-card-agotado-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .cat-card-qty-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--color, #FF8500);
            color: white;
            font-size: 12px;
            font-weight: 800;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cat-card-body {
            padding: 14px;
        }
        .cat-card-nombre {
            font-size: 15px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .cat-card-precio {
            font-size: 18px;
            font-weight: 900;
            color: var(--color, #FF8500);
            margin-bottom: 8px;
        }
        .cat-card-stock {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .cat-card-controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-menos, .btn-mas {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid var(--color, #FF8500);
            background: white;
            color: var(--color, #FF8500);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .btn-menos:hover, .btn-mas:hover {
            background: var(--color, #FF8500);
            color: white;
        }
        .btn-menos:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .cat-card-cant {
            font-size: 16px;
            font-weight: 800;
            color: #333;
            min-width: 20px;
            text-align: center;
        }
        .btn-agregar {
            flex: 1;
            padding: 8px;
            background: var(--color, #FF8500);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-agregar:hover { opacity: 0.85; }

        /* ── CARRITO FLOTANTE ─────────────────────────────── */
        .carrito-fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: var(--color, #FF8500);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 22px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 100;
            transition: transform 0.2s;
        }
        .carrito-fab:hover { transform: scale(1.04); }
        .carrito-fab-total {
            background: rgba(255,255,255,0.25);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* ── MODAL CARRITO ────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: #eee;
            border-radius: 4px;
            margin: 0 auto 20px;
        }
        .modal-titulo {
            font-size: 18px;
            font-weight: 800;
            color: #333;
            margin-bottom: 16px;
        }

        .carrito-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .carrito-item img {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f0f0f0;
        }
        .carrito-item-info { flex: 1; min-width: 0; }
        .carrito-item-nombre {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .carrito-item-precio {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .carrito-item-controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .carrito-resumen {
            background: #fafafa;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
        }
        .carrito-resumen-fila {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }
        .carrito-resumen-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 900;
            color: #333;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 6px;
        }

        .btn-pedir {
            width: 100%;
            padding: 16px;
            background: var(--color, #FF8500);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .btn-pedir:hover { opacity: 0.9; }

        /* ── MODAL LOGIN/REGISTRO CLIENTE ─────────────────── */
        .modal-auth {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-auth.active { display: flex; }
        .modal-auth-box {
            background: white;
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
        }
        .modal-auth-tabs {
            display: flex;
            gap: 4px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #888;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--color, #FF8500);
            color: white;
        }
        .auth-field {
            margin-bottom: 12px;
        }
        .auth-field label {
            font-size: 12px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }
        .auth-field input {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-field input:focus { border-color: var(--color, #FF8500); }
        .btn-auth {
            width: 100%;
            padding: 13px;
            background: var(--color, #FF8500);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-cancelar-auth {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #aaa;
            border: none;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }

        /* ── MODAL CONFIRMACIÓN PEDIDO ────────────────────── */
        .modal-confirm {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 400;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-confirm.active { display: flex; }
        .modal-confirm-box {
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .modal-confirm-box .icono { font-size: 52px; margin-bottom: 16px; }
        .modal-confirm-box h2 { font-size: 22px; font-weight: 900; color: #333; margin-bottom: 8px; }
        .modal-confirm-box p { font-size: 14px; color: #888; line-height: 1.5; margin-bottom: 20px; }
        .btn-whatsapp {
            display: block;
            width: 100%;
            padding: 14px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
        }
        .btn-cerrar-confirm {
            width: 100%;
            padding: 11px;
            background: #f5f5f5;
            color: #555;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        /* ── ESTADO VACÍO ─────────────────────────────────── */
        .cat-empty {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        .cat-empty p:first-child { font-size: 48px; }
        .cat-empty p:last-child { font-size: 15px; margin-top: 12px; }

        /* ── RESPONSIVE ───────────────────────────────────── */
        @media (max-width: 480px) {
            .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .cat-card-img { height: 140px; }
            .cat-header { padding: 20px 16px 50px; }
            .cat-header h1 { font-size: 22px; }
        }
        @media (max-width: 320px) {
            .cat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="cat-header" id="catHeader">
    <h1 id="catNombre">Cargando...</h1>
    <p id="catDescripcion"></p>
    <div class="cat-header-redes" id="catRedes"></div>
</div>

<!-- BUSCADOR -->
<div class="cat-search-wrap">
    <input type="text" class="cat-search" id="catBuscar"
        placeholder="🔍 Buscar producto..."
        oninput="filtrarProductos()">
</div>

<!-- CONTENIDO -->
<div class="cat-main">
    <div class="cat-info-bar">
        <span id="catContador">Cargando productos...</span>
        <span id="catClienteInfo"></span>
    </div>
    <div id="catGrid" class="cat-grid"></div>
</div>

<!-- FAB CARRITO -->
<button class="carrito-fab" id="carritoFab" onclick="abrirCarrito()">
    🛒 Ver carrito
    <span class="carrito-fab-total" id="carritoFabTotal">$0.00</span>
</button>

<!-- MODAL CARRITO -->
<div class="modal-overlay" id="modalCarrito">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <p class="modal-titulo">🛒 Tu carrito</p>
        <div id="carritoItems"></div>
        <div class="carrito-resumen" id="carritoResumen" style="display:none">
            <div class="carrito-resumen-fila">
                <span id="carritoNumItems">0 productos</span>
                <span></span>
            </div>
            <div class="carrito-resumen-total">
                <span>Total</span>
                <span id="carritoTotal">$0.00</span>
            </div>
        </div>
        <button class="btn-pedir" id="btnPedir" onclick="irAPedir()" style="display:none">
            ✅ Enviar solicitud de pedido
        </button>
        <button onclick="cerrarCarrito()"
            style="width:100%;padding:12px;background:transparent;color:#aaa;border:none;font-size:14px;cursor:pointer;margin-top:8px">
            Seguir viendo productos
        </button>
    </div>
</div>

<!-- MODAL AUTH (login/registro cliente) -->
<div class="modal-auth" id="modalAuth">
    <div class="modal-auth-box">
        <div class="modal-auth-tabs">
            <button class="tab-btn active" id="tabLogin" onclick="mostrarTab('login')">Iniciar sesión</button>
            <button class="tab-btn" id="tabRegistro" onclick="mostrarTab('registro')">Soy nuevo</button>
        </div>

        <!-- LOGIN -->
        <div id="panelLogin">
            <div class="auth-field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="tu@correo.com">
            </div>
            <div class="auth-field">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">
            </div>
            <button class="btn-auth" onclick="hacerLogin()">Entrar</button>
        </div>

        <!-- REGISTRO -->
        <div id="panelRegistro" style="display:none">
            <div class="auth-field">
                <label>Nombre completo *</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
            </div>
            <div class="auth-field">
                <label>Teléfono *</label>
                <input type="tel" id="regTelefono" placeholder="Tu número de WhatsApp">
            </div>
            <div class="auth-field">
                <label>Email *</label>
                <input type="email" id="regEmail" placeholder="tu@correo.com">
            </div>
            <div class="auth-field">
                <label>Contraseña *</label>
                <input type="password" id="regPassword" placeholder="Crea una contraseña">
            </div>
            <button class="btn-auth" onclick="hacerRegistro()">Crear cuenta y pedir</button>
        </div>

        <button class="btn-cancelar-auth" onclick="cerrarAuth()">Cancelar</button>
    </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-confirm" id="modalConfirm">
    <div class="modal-confirm-box">
        <div class="icono">🎉</div>
        <h2>¡Pedido enviado!</h2>
        <p id="confirmMsg">Tu solicitud fue enviada al vendedor. Pronto se pondrá en contacto contigo.</p>
        <a id="btnWaConfirm" href="#" target="_blank" class="btn-whatsapp">
            💬 Escribir por WhatsApp
        </a>
        <button class="btn-cerrar-confirm" onclick="cerrarConfirm()">
            Ver más productos
        </button>
    </div>
</div>

<script>
// ── CONFIGURACIÓN ────────────────────────────────────────────
var API_URL        = "https://mycontrol-backend-production-3402.up.railway.app"
var slug           = new URLSearchParams(window.location.search).get("s")
var tiendaData     = null
var todosProductos = []
var carrito        = []   // { id, nombre, precio, stock, imagen_url, cantidad }
var clienteSession = null // { id, nombre, telefono, email, empresa_id }

// ── ARRANQUE ─────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", async function() {
    if (!slug) {
        mostrarError("No se encontró la tienda. Verifica el enlace.")
        return
    }

    // Restaurar sesión de cliente si existe
    var sesGuardada = sessionStorage.getItem("cliente_" + slug)
    if (sesGuardada) clienteSession = JSON.parse(sesGuardada)
    actualizarClienteInfo()

    await cargarTienda()
})

// ── CARGAR TIENDA ─────────────────────────────────────────────
async function cargarTienda() {
    try {
        const res = await fetch(API_URL + "/tienda/publica/" + slug)
        if (!res.ok) {
            mostrarError("Esta tienda no existe o no está disponible.")
            return
        }
        tiendaData = await res.json()

        // Aplicar color personalizado
        document.documentElement.style.setProperty("--color", tiendaData.color_primario || "#FF8500")

        // Llenar header
        document.title                          = tiendaData.nombre_negocio + " — Catálogo"
        document.getElementById("catNombre").textContent      = tiendaData.nombre_negocio
        document.getElementById("catDescripcion").textContent = tiendaData.descripcion || ""

        // Redes sociales
        var redes = document.getElementById("catRedes")
        redes.innerHTML = ""
        if (tiendaData.whatsapp) {
            redes.innerHTML += '<a href="https://wa.me/' + tiendaData.whatsapp + '" target="_blank">💬 WhatsApp</a>'
        }
        if (tiendaData.instagram) {
            var ig = tiendaData.instagram.replace("@", "")
            redes.innerHTML += '<a href="https://instagram.com/' + ig + '" target="_blank">📸 Instagram</a>'
        }

        // Cargar productos
        todosProductos = tiendaData.productos || []
        renderProductos(todosProductos)

    } catch (err) {
        console.error(err)
        mostrarError("Ocurrió un error al cargar la tienda.")
    }
}

// ── RENDER PRODUCTOS ──────────────────────────────────────────
function renderProductos(lista) {
    var grid = document.getElementById("catGrid")
    var contador = document.getElementById("catContador")
    grid.innerHTML = ""

    if (lista.length === 0) {
        contador.textContent = "Sin productos disponibles"
        grid.innerHTML =
            '<div class="cat-empty" style="grid-column:1/-1">' +
            '<p>🛍️</p><p>No hay productos en este catálogo todavía</p></div>'
        return
    }

    contador.innerHTML = "<strong>" + lista.length + "</strong> producto" + (lista.length !== 1 ? "s" : "") + " disponibles"

    lista.forEach(function(p) {
        var enCarrito = carrito.find(function(c) { return c.id === p.id })
        var cantidad  = enCarrito ? enCarrito.cantidad : 0
        var agotado   = p.stock <= 0

        var imgSrc = p.imagen_url || ""

        var card = document.createElement("div")
        card.className = "cat-card" + (agotado ? " agotado" : "")
        card.id = "card-" + p.id

        card.innerHTML =
            (cantidad > 0 ? '<div class="cat-card-qty-badge">' + cantidad + '</div>' : '') +
            (agotado ? '<div class="cat-card-agotado-badge">Agotado</div>' : '') +
            '<img class="cat-card-img" src="' + imgSrc + '" onerror="this.src=\'\';this.style.background=\'#f0f0f0\'" alt="' + p.nombre + '">' +
            '<div class="cat-card-body">' +
                '<div class="cat-card-nombre">' + p.nombre + '</div>' +
                '<div class="cat-card-precio">$' + parseFloat(p.precio).toFixed(2) + '</div>' +
                '<div class="cat-card-stock">' + (agotado ? "⚠️ Sin stock" : "✅ Disponible — " + p.stock + " uds") + '</div>' +
                (agotado ? '' :
                '<div class="cat-card-controles">' +
                    '<button class="btn-menos" onclick="cambiarCantidad(' + p.id + ', -1)" ' + (cantidad === 0 ? 'disabled' : '') + '>−</button>' +
                    '<span class="cat-card-cant" id="cant-' + p.id + '">' + cantidad + '</span>' +
                    '<button class="btn-mas" onclick="cambiarCantidad(' + p.id + ', 1)">+</button>' +
                    (cantidad === 0
                        ? '<button class="btn-agregar" onclick="cambiarCantidad(' + p.id + ', 1)">Agregar</button>'
                        : '') +
                '</div>') +
            '</div>'

        grid.appendChild(card)
    })
}

// ── FILTRO DE BÚSQUEDA ────────────────────────────────────────
function filtrarProductos() {
    var texto = document.getElementById("catBuscar").value.toLowerCase().trim()
    if (!texto) { renderProductos(todosProductos); return }
    var filtrados = todosProductos.filter(function(p) {
        return p.nombre.toLowerCase().includes(texto)
    })
    renderProductos(filtrados)
}

// ── CAMBIAR CANTIDAD ──────────────────────────────────────────
function cambiarCantidad(id, delta) {
    var producto = todosProductos.find(function(p) { return p.id === id })
    if (!producto) return

    var existe = carrito.find(function(c) { return c.id === id })

    if (delta > 0) {
        if (!existe) {
            carrito.push({ id: producto.id, nombre: producto.nombre, precio: producto.precio, stock: producto.stock, imagen_url: producto.imagen_url, cantidad: 1 })
        } else {
            if (existe.cantidad >= producto.stock) {
                alert("Solo hay " + producto.stock + " disponibles")
                return
            }
            existe.cantidad++
        }
    } else {
        if (!existe) return
        existe.cantidad--
        if (existe.cantidad <= 0) {
            carrito = carrito.filter(function(c) { return c.id !== id })
        }
    }

    actualizarFab()
    // Re-render solo la card afectada
    var texto = document.getElementById("catBuscar").value.toLowerCase().trim()
    var lista  = texto ? todosProductos.filter(function(p) { return p.nombre.toLowerCase().includes(texto) }) : todosProductos
    renderProductos(lista)
}

// ── FAB CARRITO ───────────────────────────────────────────────
function actualizarFab() {
    var fab   = document.getElementById("carritoFab")
    var total = carrito.reduce(function(a, c) { return a + c.precio * c.cantidad }, 0)
    var items = carrito.reduce(function(a, c) { return a + c.cantidad }, 0)

    if (items > 0) {
        fab.style.display = "flex"
        document.getElementById("carritoFabTotal").textContent = "$" + total.toFixed(2)
    } else {
        fab.style.display = "none"
    }
}

// ── MODAL CARRITO ─────────────────────────────────────────────
function abrirCarrito() {
    var cont = document.getElementById("carritoItems")
    cont.innerHTML = ""

    if (carrito.length === 0) {
        cont.innerHTML = '<div class="cat-empty"><p>🛒</p><p>Tu carrito está vacío</p></div>'
        document.getElementById("carritoResumen").style.display = "none"
        document.getElementById("btnPedir").style.display       = "none"
    } else {
        carrito.forEach(function(item) {
            var div = document.createElement("div")
            div.className = "carrito-item"
            div.innerHTML =
                '<img src="' + (item.imagen_url || "") + '" onerror="this.src=\'\';this.style.background=\'#f0f0f0\'">' +
                '<div class="carrito-item-info">' +
                    '<div class="carrito-item-nombre">' + item.nombre + '</div>' +
                    '<div class="carrito-item-precio">$' + parseFloat(item.precio).toFixed(2) + ' c/u</div>' +
                '</div>' +
                '<div class="carrito-item-controles">' +
                    '<button class="btn-menos" style="width:28px;height:28px;font-size:16px" onclick="cambiarCantidad(' + item.id + ',-1);abrirCarrito()">−</button>' +
                    '<span style="font-weight:800;min-width:18px;text-align:center">' + item.cantidad + '</span>' +
                    '<button class="btn-mas" style="width:28px;height:28px;font-size:16px" onclick="cambiarCantidad(' + item.id + ',1);abrirCarrito()">+</button>' +
                '</div>'
            cont.appendChild(div)
        })

        var total = carrito.reduce(function(a, c) { return a + c.precio * c.cantidad }, 0)
        var items = carrito.reduce(function(a, c) { return a + c.cantidad }, 0)
        document.getElementById("carritoNumItems").textContent  = items + " producto" + (items !== 1 ? "s" : "")
        document.getElementById("carritoTotal").textContent     = "$" + total.toFixed(2)
        document.getElementById("carritoResumen").style.display = "block"
        document.getElementById("btnPedir").style.display       = "block"
    }

    document.getElementById("modalCarrito").classList.add("active")
}

function cerrarCarrito() {
    document.getElementById("modalCarrito").classList.remove("active")
}

// ── PEDIR ─────────────────────────────────────────────────────
function irAPedir() {
    cerrarCarrito()
    if (clienteSession) {
        enviarPedido()
    } else {
        document.getElementById("modalAuth").classList.add("active")
    }
}

// ── AUTH CLIENTE ──────────────────────────────────────────────
function mostrarTab(tab) {
    document.getElementById("panelLogin").style.display   = tab === "login"    ? "block" : "none"
    document.getElementById("panelRegistro").style.display = tab === "registro" ? "block" : "none"
    document.getElementById("tabLogin").classList.toggle("active",    tab === "login")
    document.getElementById("tabRegistro").classList.toggle("active", tab === "registro")
}

function cerrarAuth() {
    document.getElementById("modalAuth").classList.remove("active")
}

async function hacerLogin() {
    var email    = document.getElementById("loginEmail").value.trim()
    var password = document.getElementById("loginPassword").value.trim()
    if (!email || !password) { alert("Completa todos los campos"); return }

    try {
        const res  = await fetch(API_URL + "/clientes-tienda/login", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ email, password, empresa_id: tiendaData.empresa_id })
        })
        const data = await res.json()
        if (!res.ok) { alert(data.error || "Credenciales incorrectas"); return }

        clienteSession = data.cliente
        sessionStorage.setItem("cliente_" + slug, JSON.stringify(clienteSession))
        actualizarClienteInfo()
        cerrarAuth()
        enviarPedido()
    } catch (err) {
        alert("Error al conectar")
    }
}

async function hacerRegistro() {
    var nombre   = document.getElementById("regNombre").value.trim()
    var telefono = document.getElementById("regTelefono").value.trim()
    var email    = document.getElementById("regEmail").value.trim()
    var password = document.getElementById("regPassword").value.trim()

    if (!nombre || !telefono || !email || !password) { alert("Completa todos los campos"); return }

    try {
        const res  = await fetch(API_URL + "/clientes-tienda/registro", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ nombre, telefono, email, password, empresa_id: tiendaData.empresa_id })
        })
        const data = await res.json()
        if (!res.ok) { alert(data.error || "Error al registrarse"); return }

        clienteSession = data.cliente
        sessionStorage.setItem("cliente_" + slug, JSON.stringify(clienteSession))
        actualizarClienteInfo()
        cerrarAuth()
        enviarPedido()
    } catch (err) {
        alert("Error al conectar")
    }
}

// ── ENVIAR PEDIDO ─────────────────────────────────────────────
async function enviarPedido() {
    if (carrito.length === 0) { alert("Tu carrito está vacío"); return }

    try {
        const res = await fetch(API_URL + "/pedidos", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({
                empresa_id: tiendaData.empresa_id,
                cliente_id: clienteSession.id,
                productos:  carrito.map(function(c) {
                    return { producto_id: c.id, cantidad: c.cantidad, precio_unitario: c.precio }
                })
            })
        })
        const data = await res.json()
        if (!res.ok) { alert(data.error || "Error al enviar pedido"); return }

        // Limpiar carrito
        carrito = []
        actualizarFab()

        // Mensaje de confirmación con WhatsApp
        var total   = data.total || 0
        var msgWa   = "¡Hola! Acabo de hacer un pedido en tu catálogo 🛍️\n"
            + "Nombre: " + clienteSession.nombre + "\n"
            + "Total: $" + parseFloat(total).toFixed(2) + "\n"
            + "Pedido #" + data.pedido_id

        if (tiendaData.whatsapp) {
            document.getElementById("btnWaConfirm").href =
                "https://wa.me/" + tiendaData.whatsapp + "?text=" + encodeURIComponent(msgWa)
            document.getElementById("btnWaConfirm").style.display = "block"
        } else {
            document.getElementById("btnWaConfirm").style.display = "none"
        }

        document.getElementById("confirmMsg").textContent =
            "Tu pedido #" + data.pedido_id + " fue enviado. El vendedor lo revisará pronto."

        document.getElementById("modalConfirm").classList.add("active")
        var lista = document.getElementById("catGrid")
        await cargarTienda()

    } catch (err) {
        alert("Error al enviar pedido")
        console.error(err)
    }
}

function cerrarConfirm() {
    document.getElementById("modalConfirm").classList.remove("active")
}

// ── INFO CLIENTE LOGUEADO ─────────────────────────────────────
function actualizarClienteInfo() {
    var el = document.getElementById("catClienteInfo")
    if (clienteSession) {
        el.innerHTML = '👤 <strong>' + clienteSession.nombre + '</strong> &nbsp;|&nbsp; <a href="#" onclick="cerrarSesionCliente()" style="color:#aaa;font-size:12px">Salir</a>'
    } else {
        el.textContent = ""
    }
}

function cerrarSesionCliente() {
    sessionStorage.removeItem("cliente_" + slug)
    clienteSession = null
    actualizarClienteInfo()
}

// ── ERROR ─────────────────────────────────────────────────────
function mostrarError(msg) {
    document.getElementById("catHeader").style.display = "none"
    document.getElementById("catGrid").innerHTML =
        '<div class="cat-empty" style="grid-column:1/-1"><p>😕</p><p>' + msg + '</p></div>'
    document.getElementById("catContador").textContent = ""
}
</script>
